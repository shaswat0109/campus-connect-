services:
  - type: web
    name: campus-connect-api
    runtime: python
    plan: free
    branch: main
    rootDir: backend
    autoDeployTrigger: off
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT run:app
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.13.15"
      - key: FLASK_DEBUG
        value: "0"
      - key: ENABLE_DEMO_REGISTRATIONS
        value: "false"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
